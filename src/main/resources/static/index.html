<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>RAW_NOTES</title>
    <link rel="stylesheet" href="tiny-brutalism.css"/>
    <style>
        /* Override and extend framework for list view */
        .notes-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem; /* Space between neobrutalist boxes */
            margin-top: 2rem;
        }

        .list-item {
            display: flex;
            align-items: center;
            background: #fff;
            border: 2px solid #000;
            box-shadow: 4px 4px 0 #000; /* Matching .box style */
            height: 60px;
            overflow: hidden;
            transition: all 0.1s ease;
        }

        .list-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
            background: #fafafa;
        }

        .item-body {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            min-width: 0;
            height: 100%;
            cursor: pointer;
        }

        .item-title {
            flex: 0 0 220px;
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 1rem;
            text-transform: uppercase;
        }

        .item-preview {
            flex: 1;
            font-size: 0.8rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 1rem;
        }

        .item-meta {
            flex: 0 0 140px;
            font-size: 0.7rem;
            text-align: right;
            color: #000;
            font-weight: bold;
        }


        .item-actions {
            display: flex;
            height: 100%;
            border-left: 2px solid #000;
        }

        .action-btn {
            width: 56px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;

            border-left: 2px solid #000;

            font-size: 1.3rem;
            font-weight: 900;

            cursor: pointer;
            user-select: none;
        }

        .action-btn:hover {
            background: #ffff00;
        }

        .delete-trigger:hover {
            background: #ff0000;
            color: #fff;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-header text-center mt-2">
        <h1 style="font-size: 4rem; letter-spacing: -3px;">RAW_NOTES</h1>
        <div class="mt-1">
            <a href="/note" class="button mr-1" style="background: #ffff00;">+ NEW NOTE</a>
            <a href="/upload" class="button">↑ UPLOAD</a>
        </div>
    </div>

    <div class="notes-grid">
        ${NOTES_PLACEHOLDER}
    </div>
</div>

<script>
    function flashCopied(el) {
        const original = el.textContent;
        el.textContent = "✓";
        el.classList.add("copied");

        setTimeout(() => {
            el.textContent = original;
            el.classList.remove("copied");
        }, 900);
    }

    function handleAction(el) {
        const type = el.dataset.type;
        const content = el.dataset.content;
        const id = el.dataset.id;

        if (type === "NOTE" || type === "SNIPPET") {
            navigator.clipboard.writeText(content).then(() => {
                flashCopied(el);
            });
        }

        if (type === "LINK") {
            window.open(content, "_blank");
        }

        if (type === "FILE") {
            window.location.href = "/download?id=" + id;
        }
    }

    function deleteNote(id) {
        if (confirm("DELETE " + id + "?")) {
            fetch('/api/note/' + id, { method: 'DELETE' }).then(() => location.reload());
        }
    }
</script>
</body>
</html>
