<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAW_NOTES</title>
    <link rel="stylesheet" href="tiny-brutalism.css" />

    <style>
        .box {
            padding: 0;
            display: flex;
            position: relative;
            margin-top: 1.5rem;
            transition: transform 0.1s ease;
        }

        .box:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
        }

        .timestamp {
            position: absolute;
            top: -1.2rem;
            left: -2px;
            background: #000;
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .note-body {
            padding: 1rem;
            flex-grow: 1;
            min-width: 0;
            cursor: pointer;
        }

        .note-content {
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.4;
            word-break: break-all;
        }

        .actions-group {
            display: flex;
            border-left: 2px solid #000;
            background: #f0f0f0;
        }

        .action {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            border-right: 2px solid #000;
            cursor: pointer;
            font-weight: bold;
            text-decoration: none;
            color: #000;
        }

        .action:last-child { border-right: none; }

        .action:hover {
            background: #000;
            color: #fff;
        }

        @media (max-width: 600px) {
            .box { flex-direction: column; }
            .actions-group {
                border-left: none;
                border-top: 2px solid #000;
                height: 45px;
                width: 100%;
            }
            .action { width: 50%; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center mt-2">RAW_NOTES</h1>

    <div class="text-center mb-2">
        <a href="/note" class="button mr-1">+ NEW</a>
        <a href="/upload" class="button">↑ UPLOAD</a>
    </div>

    <!-- NOTES -->
    ${NOTES_PLACEHOLDER}
</div>

<script>
    function primaryAction(el) {
        const box = el.closest('.box');
        const type = box.dataset.type;

        if (type === "text") {
            const text = box.querySelector('.note-content').innerText;
            navigator.clipboard.writeText(text.trim());
            flash(el);
        }

        if (type === "link" || type === "file") {
            const url = box.dataset.url;
            window.open(url, "_blank");
        }
    }

    function flash(el) {
        el.style.background = "#000";
        el.style.color = "#fff";
        setTimeout(() => {
            el.style.background = "";
            el.style.color = "";
        }, 150);
    }

    function deleteNote(id) {
        if (confirm("DELETE NOTE " + id + "?")) {
            console.log("Deleted", id);
        }
    }
</script>

</body>
</html>
