<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAW_NOTES</title>
    <link rel="stylesheet" href="tiny-brutalism.css" />
    <style>
        .notes-grid {
            display: flex;
            flex-direction: column;
            border-top: 2px solid #000;
            margin-top: 2rem;
        }

        .list-item {
            display: flex;
            align-items: center;
            background: #fff;
            border: 2px solid #000;
            border-top: none;
            height: 50px;
            overflow: hidden;
        }

        .list-item:hover {
            background: #fafafa;
        }

        .item-body {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            min-width: 0;
            height: 100%;
            cursor: pointer;
        }

        .item-icon {
            flex: 0 0 40px;
            font-size: 1.1rem;
            display: flex;
            justify-content: center;
            opacity: 0.7;
        }

        .item-title {
            flex: 0 0 200px;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 1rem;
            text-transform: uppercase;
        }

        .item-preview {
            flex: 1;
            font-size: 0.8rem;
            color: #888;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Roboto Mono', monospace;
            padding-right: 1rem;
        }

        .item-meta {
            flex: 0 0 130px;
            font-size: 0.7rem;
            text-align: right;
            color: #aaa;
        }

        .item-actions {
            display: flex;
            height: 100%;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 1rem;
            height: 100%;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
            color: #000;
            border-left: 2px solid #000;
            transition: background 0.05s;
            width: 3rem;
        }

        .action-btn:hover {
            background: lightseagreen;
            filter: none;
        }

        .delete-trigger {
            color: #000;
            font-size: 0.8rem;
        }

        .delete-trigger:hover {
            background: #ff0000;
            color: #fff;
            filter: none;
        }

        @media (max-width: 850px) {
            .item-preview { display: none; }
            .item-title { flex: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-header text-center mt-2">
        <h1 style="font-size: 3.5rem; letter-spacing: -3px; font-weight: 900;">RAW_NOTES</h1>
        <div class="mt-1">
            <a href="/note" class="button mr-1" style="background: #ffff00;">+ NEW NOTE</a>
            <a href="/upload" class="button">↑ UPLOAD FILE</a>
        </div>
    </div>

    <div class="notes-grid">
        ${NOTES_PLACEHOLDER}
    </div>
</div>

<script>
    function deleteNote(id) {
        if (confirm("DELETE NOTE " + id + "?")) {
            fetch('/api/notes/' + id, { method: 'DELETE' })
                .then(() => location.reload());
        }
    }

    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => {
            alert("COPIED TO CLIPBOARD");
        });
    }
</script>
</body>
</html>
