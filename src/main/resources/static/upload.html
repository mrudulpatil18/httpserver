<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UPLOAD // RAW_NOTES</title>
    <link rel="stylesheet" href="tiny-brutalism.css" />
    <base href="/raw/">
    <style>
        .form-box {
            max-width: 500px;
            margin: 2rem auto;
            background: #fff;
        }
        h1 {
            font-size: 3.5rem;
            letter-spacing: -3px;
            font-weight: 900;
            text-transform: uppercase;
        }
        .button[type="submit"] {
            width: 100%;
            background: #00ff00; /* Green for uploads/downloads */
            margin-top: 1rem;
            font-weight: 900;
        }
        input[type="file"] {
            background: #f5f5f5;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">

    <h1 class="text-center mt-2">UPLOAD_FILE</h1>

    <div class="text-center mb-2">
        <a href="." class="button mr-1">HOME</a>
        <a href="note" class="button">+ NEW NOTE</a>
    </div>

    <div class="box form-box">
        <form action="upload" method="POST" enctype="multipart/form-data">
            <label>SELECT_FILE</label>
            <input type="file" name="file" required>

            <label>DISPLAY_TITLE</label>
            <input type="text" name="title">

            <button type="submit" class="button">START_UPLOAD</button>
        </form>
    </div>

</div>
</body>
</html>
