<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>${TITLE} - RAW_NOTES</title>
    <link rel="stylesheet" href="tiny-brutalism.css" />
    <style>
        .note-card {
            background: #fff;
            border: 4px solid #000;
            box-shadow: 12px 12px 0 #000;
            padding: 2rem;
            margin-top: 2rem;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .type-tag {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 5px 15px;
            font-weight: bold;
            margin-bottom: 1rem;
            transform: rotate(-1deg);
        }
        .content-well {
            margin: 2rem 0;
            padding: 1.5rem;
            background: #fdfdfd;
            border: 2px solid #000;
            min-height: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .meta-footer {
            font-size: 0.8rem;
            border-top: 2px solid #000;
            padding-top: 1rem;
            margin-top: 2rem;
        }
        .btn-update { background: #ffff00 !important; } /* Yellow for Edit */
        .btn-delete { background: #ff4d4d !important; color: #fff !important; }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mt-2">
        <a href="/static" class="button">← BACK TO LIST</a>
    </div>

    <div class="note-card">
        <div class="type-tag">${TYPE}</div>
        <h1 style="font-size: 2.5rem; margin-bottom: 0.5rem;">${TITLE}</h1>

        <div class="content-well">
            ${CONTENT_BLOCK}
        </div>

        <div class="row">
            <div class="col-6">
                <button class="button btn-update" style="width: 100%" onclick="location.href='/edit/${ID}'">✎ EDIT NOTE</button>
            </div>
            <div class="col-6">
                <button class="button btn-delete" style="width: 100%" onclick="deleteNote('${ID}')">✘ DELETE</button>
            </div>
        </div>

        <div class="meta-footer">
            <strong>ID:</strong> ${ID} | <strong>CREATED:</strong> ${CREATED_AT} | <strong>MODIFIED:</strong> ${MODIFIED_AT}
        </div>
    </div>
</div>

<script>
    function deleteNote(id) {
        if (confirm("DELETE " + id + "?")) {
            fetch('/api/note/' + id, { method: 'DELETE' })
                .then(() => {
                    // Redirect to the index page since this note is gone
                    window.location.href = '/';
                })
                .catch(err => alert("Error deleting note"));
        }
    }
</script>
</body>
</html>
