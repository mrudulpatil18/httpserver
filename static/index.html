<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAW_NOTES</title>
    <link rel="stylesheet" href="tiny-brutalism.css" />
    <style>
        /* Override and extend framework for list view */
        .notes-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem; /* Space between neobrutalist boxes */
            margin-top: 2rem;
        }

        .list-item {
            display: flex;
            align-items: center;
            background: #fff;
            border: 2px solid #000;
            box-shadow: 4px 4px 0 #000; /* Matching .box style */
            height: 60px;
            overflow: hidden;
            transition: all 0.1s ease;
        }

        .list-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 #000;
            background: #fafafa;
        }

        .item-body {
            flex: 1;
            display: flex;
            align-items: center;
            padding: 0 1rem;
            min-width: 0;
            height: 100%;
            cursor: pointer;
        }

        .item-icon {
            flex: 0 0 45px;
            font-size: 1.2rem;
            opacity: 0.8;
            display: flex;
            justify-content: center;
        }

        .item-title {
            flex: 0 0 220px;
            font-weight: 700;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 1rem;
            text-transform: uppercase;
        }

        .item-preview {
            flex: 1;
            font-size: 0.8rem;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            padding-right: 1rem;
        }

        .item-meta {
            flex: 0 0 140px;
            font-size: 0.7rem;
            text-align: right;
            color: #000;
            font-weight: bold;
        }

        .item-actions {
            display: flex;
            height: 100%;
            border-left: 2px solid #000;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 50px;
            height: 100%;
            cursor: pointer;
            transition: background 0.1s;
            border-left: 1px solid #eee; /* Light separator between actions */
        }

        .action-btn:hover {
            background: #ffff00; /* Signature yellow hover */
        }

        .delete-trigger:hover {
            background: #ff0000;
            color: #fff;
        }

        @media (max-width: 850px) {
            .item-preview { display: none; }
            .item-title { flex: 1; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-header text-center mt-2">
        <h1 style="font-size: 4rem; letter-spacing: -3px;">RAW_NOTES</h1>
        <div class="mt-1">
            <a href="/note" class="button mr-1" style="background: #ffff00;">+ NEW NOTE</a>
            <a href="/upload" class="button">↑ UPLOAD</a>
        </div>
    </div>

    <div class="notes-grid">
        ${NOTES_PLACEHOLDER}
    </div>
</div>

<script>
    function deleteNote(id) {
        if (confirm("DELETE " + id + "?")) {
            fetch('/api/notes/' + id, { method: 'DELETE' }).then(() => location.reload());
        }
    }
    function copyToClipboard(text) {
        navigator.clipboard.writeText(text).then(() => alert("COPIED"));
    }
</script>
</body>
</html>
