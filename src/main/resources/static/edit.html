<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>EDIT — ${TITLE}</title>
    <link rel="stylesheet" href="tiny-brutalism.css"/>
    <base href="/raw/">
    <style>
        .note-card {
            background: #fff;
            border: 4px solid #000;
            box-shadow: 12px 12px 0 #000;
            padding: 2rem;
            margin-top: 2rem;
        }

        .type-tag {
            display: inline-block;
            background: #000;
            color: #fff;
            padding: 5px 15px;
            font-weight: bold;
            margin-bottom: 1rem;
            transform: rotate(-1deg);
        }

        .content-well {
            margin: 2rem 0;
            padding: 1.5rem;
            background: #fdfdfd;
            border: 2px solid #000;
            min-height: 200px;
        }

        input[type="text"], textarea {
            width: 100%;
            border: 2px solid #000;
            padding: 0.8rem;
            font-family: inherit;
            font-size: 1rem;
            background: #fff;
        }

        textarea {
            resize: vertical;
        }

        .readonly-box {
            padding: 1rem;
            background: #eee;
            border: 2px dashed #000;
            font-weight: bold;
            text-align: center;
        }

        .btn-save {
            background: #ffff00 !important;
        }

        .btn-cancel {
            background: #fff !important;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="text-center mt-2">
        <a href="../${ID}" class="button">← BACK TO DETAILS</a>
    </div>

    <form method="POST" action="" enctype="multipart/form-data">
        <div class="note-card">

            <div class="type-tag">${TYPE}</div>

            <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">
                <input type="text" name="title" value="${TITLE}" required/>
            </h1>

            <div class="content-well">
                ${CONTENT_BLOCK}
            </div>

            <div class="row">
                <div class="col-6">
                    <button class="button btn-save" type="submit" style="width:100%">
                        SAVE CHANGES
                    </button>
                </div>
                <div class="col-6">
                    <a href="../${ID}" class="button btn-cancel" style="width:100%">
                        CANCEL
                    </a>
                </div>
            </div>

            <div class="meta-footer" style="margin-top:2rem; font-size:0.8rem;">
                <strong>ID:</strong> ${ID}
            </div>

        </div>
    </form>
</div>
</body>
</html>
